<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Deepfake Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        .card {
            background: rgba(255,255,255,0.05);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <h1>Unified Deepfake Detector</h1>
        <p>State-of-the-art AI analysis for Voice, Video, and Image authentication.</p>
        
        <div class="grid">
            <a href="/detect-audio" class="card">
                <div class="icon">🎵</div>
                <h3>Audio AI</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; margin-bottom: 0;">Analyze voice clones</p>
            </a>
            <a href="/detect-video" class="card">
                <div class="icon">📼</div>
                <h3>Video Quantum</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; margin-bottom: 0;">Detect biological fakes</p>
            </a>
            <a href="/detect-image" class="card">
                <div class="icon">🖼️</div>
                <h3>Image ELA</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; margin-bottom: 0;">Find visual manipulations</p>
            </a>
        </div>
    </div>
</body>
</html>
