{% extends "base.html" %}
{% block content %}

<section class="min-h-screen py-10 px-4 flex items-center justify-center">

    <div class="glass-panel max-w-5xl w-full rounded-3xl overflow-hidden shadow-2xl relative">
        
        <div class="h-2 w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-500"></div>

        <div class="grid md:grid-cols-2">
            
            <div class="p-12 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-white/10 bg-black/20">
                
                <h3 class="text-gray-400 font-mono text-sm tracking-widest mb-8">FINAL VERDICT</h3>

                <div class="relative w-48 h-48 flex items-center justify-center mb-8">
                    <div id="chartRing" class="absolute inset-0 rounded-full border-[12px] border-gray-800" 
                         style="background: conic-gradient(var(--verdict-color) var(--confidence), transparent 0);">
                    </div>
                    <div class="absolute inset-3 bg-[#0a0f1d] rounded-full flex flex-col items-center justify-center z-10">
                        <span id="confidenceVal" class="text-4xl font-bold font-mono text-white">0%</span>
                        <span class="text-xs text-gray-500 uppercase mt-1">Confidence</span>
                    </div>
                </div>

                <h1 id="verdictText" class="text-5xl font-bold tracking-tight mb-4 text-center">...</h1>
                
                <div id="verdictBadge" class="px-4 py-1 rounded-full text-xs font-mono border uppercase tracking-widest">
                    Wait
                </div>

            </div>

            <div class="p-12">
                <h3 class="text-cyan-400 font-mono text-sm tracking-widest mb-6 border-b border-cyan-500/20 pb-4">
                    FORENSIC ANOMALY REPORT
                </h3>

                <div id="reasonsGrid" class="space-y-4">
                    </div>

                <div class="mt-10 pt-6 border-t border-white/5">
                    <a href="/detect" class="flex items-center justify-center gap-2 text-sm font-mono text-gray-400 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        SCAN ANOTHER FILE
                    </a>
                </div>
            </div>

        </div>
    </div>

</section>

<script>
    const data = JSON.parse(localStorage.getItem("qbioforge_result"));
    if(!data) { window.location="/detect"; }

    const isFake = data.verdict.toLowerCase().includes("fake") || data.verdict.toLowerCase().includes("artificial");
    const color = isFake ? "#ef4444" : "#10b981"; // Red vs Emerald

    // Set UI Data
    const verdictTitle = document.getElementById("verdictText");
    verdictTitle.innerText = data.verdict;
    verdictTitle.style.color = color;

    document.getElementById("confidenceVal").innerText = data.confidence + "%";
    
    // Set CSS Variable for chart
    document.getElementById("chartRing").style = `background: conic-gradient(${color} ${data.confidence}%, #1f2937 0)`;

    const badge = document.getElementById("verdictBadge");
    badge.innerText = isFake ? "Manipulation Detected" : "Integrity Verified";
    badge.style.borderColor = color;
    badge.style.color = color;
    badge.style.backgroundColor = isFake ? "rgba(239, 68, 68, 0.1)" : "rgba(16, 185, 129, 0.1)";

    // Render Reasons
    const container = document.getElementById("reasonsGrid");
    
    data.explanation.forEach((text, index) => {
        const div = document.createElement("div");
        div.className = "flex items-start gap-4 p-4 rounded-lg bg-white/5 border border-white/5 hover:border-cyan-500/30 transition-colors";
        
        // Icon based on content
        let icon = `<svg class="w-5 h-5 text-gray-500 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        if(text.includes("coherence")) icon = `<svg class="w-5 h-5 text-cyan-400 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`;
        
        div.innerHTML = `
            ${icon}
            <div>
                <p class="text-sm text-gray-200 leading-relaxed">${text}</p>
            </div>
        `;
        container.appendChild(div);
    });

    // Animation entry
    gsap.from(".glass-panel", {y: 50, opacity: 0, duration: 1, ease: "power3.out"});
</script>

{% endblock %}
